variables:
  CGO_ENABLED: "0"
  BUILD_IMAGE: casjaysdev/go:latest

stages:
  - build
  - lint
  - test
  - security
  - release

build:
  stage: build
  image: $BUILD_IMAGE
  script:
    - go generate ./src/swagger
    - go build -buildvcs=false ./...
  rules:
    - if: '$CI_COMMIT_TAG == null'

lint:
  stage: lint
  image: $BUILD_IMAGE
  script:
    - go vet ./...
    - staticcheck ./...
  rules:
    - if: '$CI_COMMIT_TAG == null'

test:
  stage: test
  image: $BUILD_IMAGE
  script:
    - |
      mkdir -p "/tmp/${CI_PROJECT_NAMESPACE}"
      COVDIR=$(mktemp -d "/tmp/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}-XXXXXX")
      go test -coverprofile="$COVDIR/coverage.out" ./...
      PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%", "", $3); print int($3)}')
      [ "$PCT" -ge 60 ] || { echo "coverage $PCT% < threshold 60%"; exit 1; }
  rules:
    - if: '$CI_COMMIT_TAG == null'

secret-scan:
  stage: security
  image: trufflesecurity/trufflehog:latest
  variables:
    GIT_DEPTH: "0"
  script:
    - trufflehog git file://. --since-commit HEAD~1 --fail

vuln-scan:
  stage: security
  image: $BUILD_IMAGE
  script:
    - govulncheck ./...

release:
  stage: release
  image: $BUILD_IMAGE
  script:
    - mkdir -p dist
    - VERSION="${CI_COMMIT_TAG#v}"
    - COMMIT_ID="$(git rev-parse --short=7 HEAD)"
    - BUILD_EPOCH="$(date -u +%s)"
    - LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}'"
    - |
      for pair in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64" "freebsd amd64" "freebsd arm64"; do
        set -- $pair
        suffix=""
        [ "$1" != windows ] || suffix=.exe
        GOOS=$1 GOARCH=$2 go build -buildvcs=false -trimpath -ldflags "$LDFLAGS" -o "dist/shortner-$1-$2$suffix" ./src
      done
    - sha256sum dist/* > dist/sha256.txt
  artifacts:
    paths:
      - dist/
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "shortner $CI_COMMIT_TAG"
    description: "Automated release artifacts and checksums."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/'
