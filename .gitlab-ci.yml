# GitLab CI/CD Pipeline for shortner
# Equivalent to GitHub Actions: release.yml, beta.yml, devel.yml, docker.yml and the jobs of ci.yml (lint, coverage, secret-scan, workflow-policy, vuln-scan, image-scan)

variables:
  PROJECT_NAME: "shortner"
  PROJECT_ORG: "apimgr"
  CGO_ENABLED: "0"
  GOOS: linux
  GOARCH: amd64
  # Go CI defaults to casjaysdev/go:latest — a docker/Dockerfile.build only for a genuine custom need, and then FROM casjaysdev/go:latest.
  BUILD_IMAGE: "casjaysdev/go:latest"

stages:
  - lint
  - security
  - build
  - test
  - package
  - release
  - docker

# =============================================================================
# BUILD TEMPLATES
# =============================================================================

.go-build-template: &go-build
  image: $BUILD_IMAGE
  before_script:
    # NOTE: all tooling (git, bash, govulncheck, cyclonedx-gomod, etc.) is pre-installed
    # in casjaysdev/go:latest — never `apk add` or `go install` inside a CI job.
    - export VERSION="${CI_COMMIT_TAG#v}"
    - export COMMIT_ID="${CI_COMMIT_SHA:0:7}"
    - export BUILD_EPOCH="$(date -u +%s)"
    - export BUILD_DATE="$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")"
    # OFFICIAL_SITE (optional): site.txt wins; otherwise use CI/CD Variables or leave empty
    # Never guess or assume - must be explicitly defined by user
    - |
      if [ -f site.txt ]; then
        export OFFICIAL_SITE="$(cat site.txt)"
      else
        export OFFICIAL_SITE="${OFFICIAL_SITE:-}"
      fi
    - export LDFLAGS="-s -w -X 'github.com/apimgr/shortner/src/common/version.Version=${VERSION}' -X 'github.com/apimgr/shortner/src/common/version.CommitID=${COMMIT_ID}' -X 'github.com/apimgr/shortner/src/common/version.BuildEpoch=${BUILD_EPOCH}' -X 'github.com/apimgr/shortner/src/common/version.OfficialSite=${OFFICIAL_SITE}'"

# =============================================================================
# CI JOBS (the jobs of ci.yml: lint and the security jobs)
# =============================================================================
# lint skips the weekly schedule; the security jobs run on every pipeline, the weekly schedule included

lint:
  <<: *go-build
  stage: lint
  script:
    - go vet ./...
    - staticcheck ./...
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule"

secret-scan:
  stage: security
  image:
    name: trufflesecurity/trufflehog@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452
    entrypoint: [""]
  variables:
    # The whole history must be available to the scan
    GIT_DEPTH: "0"
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "schedule" ] || [ -z "$CI_COMMIT_BEFORE_SHA" ] || [ "$CI_COMMIT_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
        trufflehog git file://. --results=verified --exclude-paths=.github/trufflehog-exclude.txt --fail
      else
        trufflehog git file://. --since-commit "$CI_COMMIT_BEFORE_SHA" --results=verified,unknown --exclude-paths=.github/trufflehog-exclude.txt --fail
      fi

workflow-policy:
  stage: security
  image: $BUILD_IMAGE
  script:
    - |
      bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
      if [ -n "$bad" ]; then echo "unpinned actions found:"; echo "$bad"; exit 1; fi
      unsafe=$(grep -RnE '^[[:space:]]*pull_request_target:' .github/ .gitea/ .forgejo/ 2>/dev/null || true)
      if [ -n "$unsafe" ]; then echo "unsafe pull_request_target trigger found:"; echo "$unsafe"; exit 1; fi

vuln-scan:
  stage: security
  image: $BUILD_IMAGE
  variables:
    GOFLAGS: -buildvcs=false
  script:
    - govulncheck ./...
  rules:
    - exists:
        - go.sum

image-build:
  stage: security
  image: docker@sha256:1c90c08b6c8fc312aa4afd066d19edeb94b0c25384e9e7f2cd9e74a28a670be8
  services:
    - docker@sha256:1c90c08b6c8fc312aa4afd066d19edeb94b0c25384e9e7f2cd9e74a28a670be8
  before_script:
    - apk add --no-cache bash curl jq coreutils
  script:
    - timeout -k 30 3600 docker build -t local/scan-target:ci -f docker/Dockerfile .
    - timeout -k 30 3600 bash docker/verify-image.sh local/scan-target:ci
    - timeout -k 30 60 docker save local/scan-target:ci -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - exists:
        - docker/Dockerfile

image-scan:
  stage: security
  image:
    name: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    entrypoint: [""]
  needs: [image-build]
  script:
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --input image.tar
  rules:
    - exists:
        - docker/Dockerfile

# =============================================================================
# RELEASE BUILDS (Tag Push: v* or semver)
# =============================================================================

build:linux-amd64:
  <<: *go-build
  stage: build
  variables:
    GOOS: linux
    GOARCH: amd64
  script:
    - go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-linux-amd64 ./src
    - if [ -d "src/client" ]; then go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${PROJECT_NAME}-cli-linux-amd64 ./src/client; fi
    # Export RELEASE_VERSION via dotenv for the release job (`needs` on this
    # job) - a job's declarative release: block can only see predefined CI
    # variables or dotenv exported by an UPSTREAM job, never its own; this
    # job only runs on tag pipelines (see rules: below) so CI_COMMIT_TAG is
    # always set here, but the guard keeps release.env empty on any other trigger
    - if [ -n "$CI_COMMIT_TAG" ]; then echo "RELEASE_VERSION=${CI_COMMIT_TAG#v}" > release.env; fi
  artifacts:
    paths:
      - ${PROJECT_NAME}-linux-amd64*
    reports:
      dotenv: release.env
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+/

