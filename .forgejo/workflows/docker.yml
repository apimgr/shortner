name: Docker Build

on:
  push:
    # main only: branches are local and temporary, never pushed
    branches: [main]
    tags:
      - 'v*'
      - '*.*.*'
      - '*-beta'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.ref == 'refs/heads/main' }}

env:
  PROJECT_NAME: shortner
  # Registry auto-detected from Gitea instance (works with self-hosted)
  # Format: {gitea-server}/owner/repo -> extracts server for registry
  IMAGE_NAME: ${{ forgejo.repository }}

jobs:
  build-standard:
    runs-on: ubuntu-26.04
    if: forgejo.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          # Extract registry from Gitea server URL (works with self-hosted)
          # Example: https://git.example.com -> git.example.com
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> $FORGEJO_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $FORGEJO_ENV
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> $FORGEJO_ENV
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> $FORGEJO_ENV
          fi
          echo "YYMM=$(date +"%y%m")" >> $FORGEJO_ENV
          if [[ "${{ forgejo.ref }}" == refs/tags/* && "${{ forgejo.ref }}" != refs/tags/*-beta ]]; then
            VERSION="${FORGEJO_REF_NAME}"
            # Strip 'v' prefix
            echo "VERSION=${VERSION#v}" >> $FORGEJO_ENV
            echo "IS_TAG=true" >> $FORGEJO_ENV
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> $FORGEJO_ENV
            echo "IS_TAG=false" >> $FORGEJO_ENV
          fi
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> $FORGEJO_ENV
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> $FORGEJO_ENV

      - name: Determine tags (standard)
        id: tags
        run: |
          # Use self-hosted registry URL
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"

          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            # Release tag - version, latest, YYMM
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          else
            # A *-beta tag also gets the beta image tag
            if [[ "${{ forgejo.ref }}" == refs/tags/*-beta ]]; then
              TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
            fi
          fi

          echo "tags=$TAGS" >> $FORGEJO_OUTPUT

      - name: Build and push (standard)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: |
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.licenses=MIT

      - name: Verify standard image runtime contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}
          REQUIRE_OVERLAY: ${{ startsWith(forgejo.ref, 'refs/tags/') && '1' || '0' }}
        run: |
          timeout -k 30 3600 docker pull "$IMAGE"
          timeout -k 30 3600 docker run --rm --no-healthcheck --name "shortner-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-8)" --entrypoint sh "$IMAGE" -c 'for c in git bash curl tor i2pd tini; do command -v "$c" || exit 1; done; apk info -e tzdata >/dev/null && apk info -e ca-certificates >/dev/null'
          image_check_name="shortner-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-8)"
          timeout -k 30 3600 docker run -d --rm --name "$image_check_name" -p 18080:80 "$IMAGE"
          trap 'timeout -k 30 60 docker rm -f "$image_check_name" >/dev/null 2>&1 || true' EXIT
          health_ok=false
          health_deadline=$((SECONDS + 60))
          while [[ "$SECONDS" -lt "$health_deadline" ]]; do
            response=$(curl -q -LSsf --max-time 2 -H 'Accept: application/json' http://127.0.0.1:18080/server/healthz 2>/dev/null || true)
            if printf '%s' "$response" | jq -e '(.status == "healthy" or .status == "degraded") and .checks.database == "ok" and .features.tor.enabled == true and (.features.tor.status == "starting" or .features.tor.status == "healthy" or .features.tor.status == "unavailable") and .features.i2p.enabled == true and (.features.i2p.status == "starting" or .features.i2p.status == "healthy" or .features.i2p.status == "unavailable")' >/dev/null 2>&1; then
              health_ok=true
              break
            fi
            sleep 2
          done
          if [ "$health_ok" != true ]; then
            printf '%s\n' "$response"
            timeout -k 30 60 docker logs "$image_check_name" 2>&1 | sed -E 's/(Operator token[^:]*: ).*/\1[REDACTED]/'
            exit 1
          fi
          wait_overlay() {
            overlay_name="$1"
            overlay_wait="$2"
            overlay_deadline=$((SECONDS + overlay_wait))
            while [[ "$SECONDS" -lt "$overlay_deadline" ]]; do
              response=$(curl -q -LSsf --max-time 2 -H 'Accept: application/json' http://127.0.0.1:18080/server/healthz 2>/dev/null || true)
              overlay_status="$(printf '%s' "$response" | jq -r ".features.$overlay_name.status // empty")"
              [ "$overlay_status" = healthy ] && break
              [ "$overlay_status" = unavailable ] && break
              sleep 2
            done
            if [ "$overlay_status" = healthy ]; then
              overlay_hostname="$(printf '%s' "$response" | jq -r ".features.$overlay_name.hostname // empty")"
              overlay_check="$(printf '%s' "$response" | jq -r ".checks.$overlay_name // empty")"
              if [ "$overlay_check" != ok ]; then echo "$overlay_name health check is not ok" >&2; exit 1; fi
              if [ "$overlay_name" = tor ]; then
                [[ "$overlay_hostname" =~ ^[a-z2-7]{56}\.onion$ ]] || { echo "invalid Tor hostname"; exit 1; }
              else
                [[ "$overlay_hostname" =~ ^[a-z2-7]{52}\.b32\.i2p$ ]] || { echo "invalid I2P hostname"; exit 1; }
              fi
              echo "$overlay_name healthy: $overlay_hostname"
            elif [ "$overlay_status" != starting ] && [ "$overlay_status" != unavailable ]; then
              echo "$overlay_name entered unexpected status: $overlay_status" >&2
              exit 1
            elif [ "$REQUIRE_OVERLAY" = 1 ]; then
              echo "$overlay_name did not become healthy within ${overlay_wait}s" >&2
              exit 1
            else
              echo "SKIP: no outbound network; $overlay_name bootstrap unavailable (network-dependent check)" >&2
            fi
          }
          wait_overlay tor 300
          wait_overlay i2p 600


  build-devel:
    runs-on: ubuntu-26.04
    if: (forgejo.event_name == 'schedule' || forgejo.event_name == 'workflow_dispatch' || forgejo.event_name == 'push') && (forgejo.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ forgejo.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> $FORGEJO_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ forgejo.actor }}
          password: ${{ secrets.FORGEJO_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $FORGEJO_ENV
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> $FORGEJO_ENV
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> $FORGEJO_ENV
          fi
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> $FORGEJO_ENV
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> $FORGEJO_ENV

      - name: Build and push (devel)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
            OFFICIAL_SITE=${{ env.OFFICIAL_SITE }}
          labels: |
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.source=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.documentation=${{ forgejo.server_url }}/${{ forgejo.repository }}
            manifest:org.opencontainers.image.licenses=MIT

      - name: Verify devel image runtime contract
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel
          REQUIRE_OVERLAY: '0'
        run: |
          timeout -k 30 3600 docker pull "$IMAGE"
          timeout -k 30 3600 docker run --rm --no-healthcheck --name "shortner-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-8)" --entrypoint sh "$IMAGE" -c 'for c in git bash curl tor i2pd tini; do command -v "$c" || exit 1; done; apk info -e tzdata >/dev/null && apk info -e ca-certificates >/dev/null'
          image_check_name="shortner-$(head -c6 /dev/urandom | od -An -tx1 | tr -d ' \n' | cut -c1-8)"
          timeout -k 30 3600 docker run -d --rm --name "$image_check_name" -p 18081:80 "$IMAGE"
          trap 'timeout -k 30 60 docker rm -f "$image_check_name" >/dev/null 2>&1 || true' EXIT
          health_ok=false
          health_deadline=$((SECONDS + 60))
          while [[ "$SECONDS" -lt "$health_deadline" ]]; do
            response=$(curl -q -LSsf --max-time 2 -H 'Accept: application/json' http://127.0.0.1:18081/server/healthz 2>/dev/null || true)
            if printf '%s' "$response" | jq -e '(.status == "healthy" or .status == "degraded") and .checks.database == "ok" and .features.tor.enabled == true and (.features.tor.status == "starting" or .features.tor.status == "healthy" or .features.tor.status == "unavailable") and .features.i2p.enabled == true and (.features.i2p.status == "starting" or .features.i2p.status == "healthy" or .features.i2p.status == "unavailable")' >/dev/null 2>&1; then
              health_ok=true
              break
            fi
            sleep 2
          done
          if [ "$health_ok" != true ]; then
            printf '%s\n' "$response"
