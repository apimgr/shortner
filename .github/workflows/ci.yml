name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security run (Monday 06:00 UTC) — only security jobs run on schedule
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: go vet ./...
      - run: GOTOOLCHAIN=go1.26.4 staticcheck ./...

  secret-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # Full history — truffleHog scans the commit range
          fetch-depth: 0
      # Empty base/head = full-history scan (schedule runs and new-branch pushes)
      - name: Determine scan range
        id: range
        run: |
          BASE=""; HEAD=""
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ github.event.before }}"; HEAD="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"; HEAD="${{ github.event.pull_request.head.sha }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD" >> "$GITHUB_OUTPUT"
      - name: Scan for secrets (truffleHog)
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341  # v3.99.0
        with:
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=${{ steps.range.outputs.base == '' && 'verified' || 'verified,unknown' }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-policy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Enforce SHA-pinned third-party actions
        run: |
          # Every third-party action must be pinned to a full 40-char commit SHA
          bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned actions found:"
            echo "$bad"
            exit 1
          fi
          unsafe=$(grep -RnE '^[[:space:]]*pull_request_target:' .github/ .gitea/ .forgejo/ 2>/dev/null || true)
          if [ -n "$unsafe" ]; then
            echo "::error::unsafe pull_request_target trigger found:"
            echo "$unsafe"
            exit 1
          fi

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Check version precedence
        run: bash tests/version_precedence.sh
      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${{ github.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ github.repository_owner }}/$(basename "${{ github.repository }}")-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$GITHUB_ENV"
          mkdir -p "$COVDIR/data"
          go test -cover ./... -args -test.gocoverdir="$COVDIR/data"
          go tool covdata textfmt -i="$COVDIR/data" -o="$COVDIR/coverage.out"
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            rm -rf -- "$COVDIR"
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi
          rm -rf -- "$COVDIR"

  build:
    if: github.event_name != 'schedule'
    needs: [lint, test]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: go generate ./src/swagger && go build -buildvcs=false ./...

  vuln-scan:
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: govulncheck ./...

  image-scan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image for scanning
        # Only when the project ships a Docker image
        if: hashFiles('docker/Dockerfile') != ''
        env:
          OFFICIAL_SITE: ${{ secrets.OFFICIAL_SITE }}
        run: |
          if [ -f site.txt ]; then OFFICIAL_SITE="$(cat site.txt)"; fi
          docker build --build-arg "OFFICIAL_SITE=$OFFICIAL_SITE" -t local/scan-target:ci -f docker/Dockerfile .
      - name: Scan image (Trivy)
        if: hashFiles('docker/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/scan-target:ci
          exit-code: '1'
          severity: CRITICAL,HIGH
